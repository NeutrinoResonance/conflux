[project]
name = "llm-super"
version = "0.1.0"
description = "Ensemble supervisor for open-source LLMs: taxonomy-driven monitors, cross-model verification, human-interruptible orchestration"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=42",
]

[project.optional-dependencies]
argon2 = ["argon2-cffi>=23"]   # enables the Argon2id KDF option for exports

[project.scripts]
llm-super = "llm_super.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_super"]

[tool.hatch.build.targets.wheel.force-include]
"agent_flows.yaml" = "llm_super/agent_flows.yaml"
"tool_manifests.yaml" = "llm_super/tool_manifests.yaml"
