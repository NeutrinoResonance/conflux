# Model & provider registry. Capabilities below reflect empirical probes
# (2026-07-16, see SPEC.md §6 matrix) — re-verify with `conflux probe`.
#
# key_source values are resolved at request time by conflux/keys.py:
#   env:VAR                      — environment variable
#   hermes:nous                  — agent_key from ~/.hermes/auth.json (rotates ~daily)
#   opencode:<provider>          — key from ~/.local/share/opencode/auth.json

# Provider usage-limit semantics (drives the limit-aware circuit breaker in
# providers.py — HTTP 429s open an escalating provider-level cooldown, a 429
# embedded in an HTTP 200 body opens a model-level one):
#   opencode-go: rolling DOLLAR windows — $12/5h, $30/week, $60/month
#     (opencode.ai/docs/go#usage-limits). Pricey models drain the window at
#     their real API price, so exhaustion can persist for hours; free models
#     keep working after the limit.
#   nanogpt: 60M INPUT TOKENS/week is the only text limit (plus 100
#     images/week, generation); models consume the allowance at per-model
#     multiplier rates (some 2x). Reported by the user 2026-07-17.
providers:
  nous:
    base_url: https://inference-api.nousresearch.com/v1
    key_source: hermes:nous
  opencode-go:
    base_url: https://opencode.ai/zen/go/v1
    key_source: opencode:opencode-go
    limits: {usd_5h: 12, usd_week: 30, usd_month: 60}
    headers: {x-opencode-session: "{session}"}  # required since Oct 2026
  nanogpt:
    base_url: https://nano-gpt.com/api/v1
    key_source: opencode:nano-gpt
    limits: {input_tokens_week: 60000000}
  zai:
    # GLM Coding Plan (Lite) endpoint. Pay-as-you-go keys use /api/paas/v4.
    base_url: https://api.z.ai/api/coding/paas/v4
    key_source: opencode:zai
  ollama-cloud:
    base_url: https://ollama.com/v1
    key_source: opencode:ollama-cloud

models:
  # ---- executors (large) ----
  deepseek-v4-pro:
    provider: nous
    id: deepseek/deepseek-v4-pro
    family: deepseek
    roles: [executor, verifier]
    logprobs: true
    top_logprobs_max: 5        # 20 works on nous, but 5 is the safe cross-provider default
    price_in_per_m: 0.28
    price_out_per_m: 0.42
    failure_priors: [FM-X.1, FM-3.1]
    fallbacks: [deepseek-v4-pro-go, deepseek-v4-pro-nano, deepseek-v4-pro-ollama]
  glm-5.3:
    provider: zai              # Coding Plan (flat rate); quota exhaustion falls through
    id: glm-5.3
    family: glm
    roles: [executor]          # no logprobs anywhere (Z.ai upstream) → never a verifier
    logprobs: false
    price_in_per_m: 0          # flat-rate plan
    price_out_per_m: 0
    failure_priors: [FM-X.2, FM-2.3]
    fallbacks: [glm-5.3-nous, glm-5.3-go, glm-5.3-nano, glm-5.3-ollama]
  # Last resort (2026-10-24): Nous, Go and NanoGPT ran out mid-run. Tool
  # calls verified on all three. No logprobs; the DeepSeek tag is a dated
  # snapshot of V4 Pro.
  deepseek-v4-pro-ollama:
    provider: ollama-cloud
    id: deepseek-v4-pro:0813
    family: deepseek
    roles: [executor]
    logprobs: false
    price_in_per_m: 0
    price_out_per_m: 0
  glm-5.3-ollama:
    provider: ollama-cloud
    id: glm-5.3
    family: glm
    roles: [executor]
    logprobs: false
    price_in_per_m: 0
    price_out_per_m: 0
  kimi-k2.6-ollama:
    provider: ollama-cloud
    id: kimi-k2.6
    family: kimi
    roles: [executor]
    logprobs: false
    price_in_per_m: 0
    price_out_per_m: 0
  glm-5.3-nous:
    provider: nous
    id: z-ai/glm-5.3
    family: glm
    roles: [executor]
    logprobs: false
    price_in_per_m: 0.35
    price_out_per_m: 1.40
    # Nous began defaulting reasoning effort to "none" (2026-10-22), which
    # GLM rejects with HTTP 400.
    request: {reasoning_effort: high}
  kimi-k2.6:
    provider: nous
    id: moonshotai/kimi-k2.6
    family: kimi
    roles: [executor]          # logprobs regressed on Nous (0/6 probes
    logprobs: false            # 2026-07-17; was top-5 on 2026-07-16) —
    top_logprobs_max: 5        # re-add verifier role if a probe recovers
    price_in_per_m: 0.40
    price_out_per_m: 1.60
    failure_priors: []
    fallbacks: [kimi-k2.6-go, kimi-k2.6-nano, kimi-k2.6-ollama]
  kimi-k3:
    provider: nous
    id: moonshotai/kimi-k3
    family: kimi
    roles: [executor]          # 2.8T reasoning model, added 2026-07-17.
    logprobs: false            # Unverified: upstream 429'd every probe (new
    top_logprobs_max: 5        # model, slammed) and Nous supported_parameters
                               # omits logprobs — re-probe when it calms down
    price_in_per_m: 3.00
    price_out_per_m: 15.00
    failure_priors: []
    fallbacks: [kimi-k3-go]
  qwen-3.7-plus:
    provider: nous
    id: qwen/qwen3.7-plus
    family: qwen
    roles: [executor, verifier]
    logprobs: true
    top_logprobs_max: 5        # Alibaba upstream rejects >5
    price_in_per_m: 0.30
    price_out_per_m: 1.20
    failure_priors: []
    fallbacks: [qwen-3.7-plus-go]

  # ---- second fallback channel: NanoGPT (weekly input-token allowance) ----
  # Added 2026-10-21 after a run died with Nous and Go down at once. No
  # qwen-3.7-plus here: NanoGPT does not serve it.
  deepseek-v4-pro-nano:
    provider: nanogpt
    id: deepseek/deepseek-v4-pro
    family: deepseek
    roles: [executor]          # no logprobs on NanoGPT → never a verifier
    logprobs: false
    price_in_per_m: 0.0        # covered by subscription allowance
    price_out_per_m: 0.0
    failure_priors: [FM-X.1, FM-3.1]
  glm-5.3-nano:
    provider: nanogpt
    id: z-ai/glm-5.3
    family: glm
    roles: [executor]
    logprobs: false
    price_in_per_m: 0.0
    price_out_per_m: 0.0
    failure_priors: [FM-X.2, FM-2.3]
  kimi-k2.6-nano:
    provider: nanogpt
    id: moonshotai/kimi-k2.6
    family: kimi
    roles: [executor]
    logprobs: false
    price_in_per_m: 0.0
    price_out_per_m: 0.0
    failure_priors: []

  # ---- fallback channel: OpenCode Go subscription (flat-rate) ----
  deepseek-v4-pro-go:
    provider: opencode-go
    id: deepseek-v4-pro
    family: deepseek
    roles: [executor, verifier]
    logprobs: true
    top_logprobs_max: 5        # top-20 trips a gateway JSON-escaping bug
    price_in_per_m: 0.0        # covered by subscription
    price_out_per_m: 0.0
    failure_priors: [FM-X.1, FM-3.1]
  glm-5.3-go:
    provider: opencode-go
    id: glm-5.3
    family: glm
    roles: [executor]
    logprobs: false            # chosen-token only on Go
    price_in_per_m: 0.0
    price_out_per_m: 0.0
    failure_priors: [FM-X.2, FM-2.3]
  kimi-k2.6-go:
    provider: opencode-go
    id: kimi-k2.6
    family: kimi
    roles: [executor]          # empty logprob alts on Go
    logprobs: false
    price_in_per_m: 0.0
    price_out_per_m: 0.0
    failure_priors: []
  kimi-k3-go:
    provider: opencode-go
    id: kimi-k3
    family: kimi
    roles: [executor]
    logprobs: false            # unverified, same 429 wall as the nous entry
    price_in_per_m: 0.0        # covered by subscription — but note it drains
    price_out_per_m: 0.0       # the Go dollar window at ~$3/$15 per M
    failure_priors: []
  qwen-3.7-plus-go:
    provider: opencode-go
    id: qwen3.7-plus
    family: qwen
    roles: [executor, verifier]
    logprobs: true
    top_logprobs_max: 5
    price_in_per_m: 0.0
    price_out_per_m: 0.0
    failure_priors: []

  # ---- small / cheap (contract extraction, lite verification) ----
  gemma-4-31b:
    provider: nous
    id: google/gemma-4-31b-it
    family: gemma
    roles: [verifier, utility]
    logprobs: false  # probe 2026-10-21: 0/3, provider stopped returning them
    top_logprobs_max: 5
    price_in_per_m: 0.08
    price_out_per_m: 0.16
    failure_priors: [FM-X.5, FM-X.7]
    fallbacks: [qwen-3.7-plus-go]   # utility calls must survive a Nous outage

routing:
  default_executor: deepseek-v4-pro
  utility: gemma-4-31b          # contract extraction, classification, planning
  referee: kimi-k2.6            # diagnoses repeated failures, picks repair strategy
  trivial_executor: gemma-4-31b # difficulty="trivial" turns (verify-lite);
                                # deliberately NOT roles:[executor] so learned
                                # routing never picks it for routine work
  verifier_pool: [qwen-3.7-plus, gemma-4-31b, deepseek-v4-pro,
                  qwen-3.7-plus-go, deepseek-v4-pro-go]
  # kimi-k2.6 removed from the pool 2026-07-17: Nous stopped returning its
  # logprobs (see the model entry); it remains an executor and the referee
  # verifiers are tried in prior-overlap-then-pool order, skipping the
  # executor's family; a provider failure fails over to the next entry
  learned: true        # route to the best-scoring executor once sampled
  min_samples: 5       # turns per model before its stats can win routing

admin:
  # Control-plane authentication. DISABLED by default (empty token): the
  # server prints a startup warning that /admin/* is open to anyone who can
  # reach the port. Enable with a single setting — a non-empty token here or
  # the CONFLUX_ADMIN_TOKEN environment variable (env wins). Clients send
  # "Authorization: Bearer <token>" / "X-Conflux-Token"; browsers may visit
  # any dashboard once with ?token=<token> to set the session cookie.
  token: ""

summaries:
  # Incremental (non-invoked) summary generation. DISABLED by default: each
  # run invokes the local Claude CLI and spends model budget. When enabled,
  # the server periodically fills missing step/message summaries with the
  # same resumable backfills as `conflux summarize-steps/-history`; every
  # run (manual or incremental) is recorded in the durable summary_jobs
  # ledger (GET /admin/summary-jobs).
  incremental: false
  interval_s: 600
  message_model: sonnet
  step_model: haiku
  max_budget_usd: 0.75

execution:
  # Generated/model-authored code is fail-closed to GCE. "off" is the only
  # runtime override that bypasses the lock because it spawns no process.
  # A future Docker adapter can be selected here by trusted operator config;
  # it is never an agent-visible tool argument.
  backend: gce                # gce | off
  locked_backend: gce
  gcloud_project: project96-sar
  gcloud_account: gce-operator@example.com
  gcloud_zone: us-central1-a
  gcloud_machine_type: e2-micro   # cheapest broadly available shared-core VM

# Danger senate: independent models rate each held action (conflux/senate.py).
# Every setting can be overridden per run by the runner's --senate* flags.
senate:
  members: [qwen-3.7-plus, deepseek-v4-pro, glm-5.3, kimi-k2.6]
  # max | median | mean | quorum. Default max: the most cautious member decides,
  # so no single relaxed member can approve over another's objection. Revisit
  # once step_lab has outcome-labelled cases.
  decision: max
  approve_below: 0.5
  quorum: 1               # used by decision: quorum
  # all | top controls legacy verdict feedback. The decider always receives
  # every member's concerns, including approvals and non-voting members.
  concerns: all

decider:
  enabled: true
  members: [deepseek-v4-pro, glm-5.3]
  done_requires: all
  next_step_from: all        # every member's step is carried out
  family_rule: any
  frequency: every_step
  max_tokens: 24000
  timeout_s: 300
  max_repairs: 1
  executor_repairs: 2         # executor retries a refused implementation before re-deciding
  max_decisions_per_request: 4
  failure_mode: closed

supervision:
  score_scale: 20               # verifier scores 1..20
  pass_threshold: 0.70          # normalized [0,1]; below this → repair loop
  criteria_aggregate: min       # every criterion must pass; "mean" is the legacy average
  verify_max_tokens: 8000       # 1500 truncated thinking verifiers before <score>
  verify_repeats: 1             # K for the standard tier
  adversarial_repeats: 3        # K for the adversarial tier (refute-framed)
  max_repairs: 2                # structural-change rule: after N repairs, escalate
  max_output_tokens: 16384      # executor completion budget (reasoning models
                                # can burn 8k on thought and return nothing)
  confirm_new_sessions: true    # ingress gate: an unknown conversation's first
                                # message returns a warning, NO model call;
                                # continuing confirms (!gate on|off at runtime)
  budget_usd_per_task: 0.50
  trailer: true                 # append supervisor summary to responses
  turn_timeout_s: 1800          # hard wall-clock cap per supervised turn
  plan_threshold_chars: 1200    # tasks longer than this are considered for decomposition
  max_plan_units: 6
